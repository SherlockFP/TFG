<!doctype html><html><head><meta charset="utf-8"><title>Wave41 isolated Gauntlet</title><style>body{margin:0;background:#171918;color:#ddd;font:12px monospace}header{padding:6px}button{margin:3px}pre{max-height:135px;overflow:auto;white-space:pre-wrap}iframe{width:100%;height:calc(100vh - 200px);border:0}</style></head><body><header>DEV guided input. Disposable silent profile, source-assisted native clock/route. No human fun/FPS claim.<div><button id="setup">Own single clock</button><button id="prepare">Walk to ship console</button><button id="land">Land by native lever</button><button id="outside">Walk outside</button><button id="defend">Observe native wave and defend</button><button id="read">Read state</button><button id="restore">Release input and restore clock</button></div><pre id="out">Booting</pre></header><iframe id="frame"></iframe><script type="module">
if(!import.meta.env.DEV)throw Error('DEV only');
const frame=document.querySelector('#frame'),out=document.querySelector('#out'),params=new URLSearchParams(location.search),mode=params.get('mode')||'endless';frame.src=params.get('join')?'/test/wave41_game.html?autojoin='+encodeURIComponent(params.get('join'))+'&net=local&lang='+(params.get('lang')||'tr'):'/test/wave41_game.html?autohost=local&mode='+mode+'&lang='+(params.get('lang')||'tr')+'&code=W41'+crypto.randomUUID().slice(0,6).toUpperCase();
let clock=null,busy=false,initial=null,trace=[],cargo=null,earned=null,start=0,sim=0,walked=0,failure=null,stoppedState=null,loopStage=null,loopComplete=false;
const g=()=>frame.contentWindow.kefal?.game,V=(x,y,z)=>new frame.contentWindow.THREE.Vector3(x,y,z),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function key(action,down){const w=frame.contentWindow,code=g().input.key(action);w.dispatchEvent(new w.KeyboardEvent(down?'keydown':'keyup',{code,key:code,bubbles:true,cancelable:true}));}
function release(){if(g())for(const k of ['forward','back','left','right','interact','drop','sprint'])key(k,false);}
function freeze(){const app=frame.contentWindow.kefal,game=g(),input=game.input;const bind=(o,k,f)=>{const own=Object.hasOwn(o,k),old=o[k];o[k]=f(old);return()=>{if(own)o[k]=old;else delete o[k];};};let permit=false;const undo=[bind(app,'loop',()=>function(t){this.last=t;frame.contentWindow.requestAnimationFrame(v=>this.loop(v));}),bind(game,'update',old=>function(dt){if(permit)return old.call(this,dt);}),bind(input,'endFrame',old=>function(){if(permit)return old.call(this);})];undo.push(bind(game.net,'request',old=>function(a,d={}){if(a==='lever')trace.push({e:'lever-request',request:structuredClone(d),current:frame.contentWindow.qa41.leverReceipt39(game),reach:frame.contentWindow.qa41.leverReach39(game,game.selfId),pos:game.player.pos.toArray(),sim});return old.call(this,a,d);}));undo.push(game.net.on('msg:sys',d=>trace.push({e:'native-sys',data:structuredClone(d),sim})));clock={step(n=1,render=false){permit=true;try{app.tick(n,1/60,render);sim+=n/60;}finally{permit=false;}},restore(){release();undo.reverse().forEach(f=>f());clock=null;}};}
function checkErrors(){if(g()?.perfInfo?.().errors?.total||frame.contentWindow.qa41errors?.length||frame.contentWindow.qa41consoleErrors?.length)throw Error('observed runtime error');}
function live(){const game=g();if(failure)throw Error('failed case requires a fresh page');checkErrors();if(!game||game.player.dead||game.downed.isDowned(game.selfId))throw Error('dead/downed operator');if(!clock)throw Error('clock not owned');if(sim>480)throw Error('eight-minute simulation budget');if(performance.now()-start>480000)throw Error('eight-minute wall budget');return game;}
async function step(n=1,render=false){live();clock.step(n,render);await new Promise(requestAnimationFrame);live();}
async function wait(fn,ms=24000){const end=performance.now()+ms;while(!fn()){if(performance.now()>end)throw Error('native observation deadline');await step(1,true);}}
async function tap(action){key(action,true);try{await step(2,true);}finally{key(action,false);}await step(2,true);}
async function aim(p){const game=live(),player=game.player;for(let i=0;i<50;i++){const d=V(...p).sub(game.camera.position),yaw=Math.atan2(-d.x,-d.z),pitch=Math.atan2(d.y,Math.hypot(d.x,d.z)),a=Math.atan2(Math.sin(yaw-player.yaw),Math.cos(yaw-player.yaw)),b=pitch-player.pitch;if(Math.abs(a)<.012&&Math.abs(b)<.012)return;const gain=(game.settings.sensitivity||1)*.0022*(player.carryTurn||1);game.input.mouseDX+=Math.max(-350,Math.min(350,-a/gain));game.input.mouseDY+=Math.max(-350,Math.min(350,-b/gain/(game.settings.invertY?-1:1)));await step(2,true);}throw Error('native aim did not converge');}
async function use(p,check){await aim(p);const t=g().findInteraction();trace.push({e:'before-E',label:t?.label,pos:g().player.pos.toArray(),sim});if(!t||check&&!check(t))throw Error('expected native E selection missing');await tap('interact');}
async function walk(p,tolerance=.32){
 const game=live(),player=game.player,before=player.pos.clone();if(game.ui.panelOpen||game.terminal.active||!game.input.enabled)throw Error('blocked native input');
 if(Math.hypot(player.pos.x-p[0],player.pos.z-p[2])<=tolerance)return;
 const heading=async()=>{const requested=Math.atan2(-(p[0]-player.pos.x),-(p[2]-player.pos.z)),turn=Math.atan2(Math.sin(requested-player.yaw),Math.cos(requested-player.yaw));if(Math.abs(turn)>.015||Math.abs(player.pitch)>.015){key('forward',false);await step(10,true);}const yaw=Math.atan2(-(p[0]-player.pos.x),-(p[2]-player.pos.z));for(let i=0;i<50;i++){const a=Math.atan2(Math.sin(yaw-player.yaw),Math.cos(yaw-player.yaw));if(Math.abs(a)<.015&&Math.abs(player.pitch)<.015)return;const gain=(game.settings.sensitivity||1)*.0022*(player.carryTurn||1);game.input.mouseDX+=Math.max(-350,Math.min(350,-a/gain));game.input.mouseDY+=Math.max(-350,Math.min(350,player.pitch/gain/(game.settings.invertY?-1:1)));await step(2,true);}throw Error('native walking heading did not converge');};
 trace.push({e:'walk-start',from:before.toArray(),target:p,yaw:player.yaw,sim});await heading();let previous=player.pos.clone(),stall=0,steps=0,minDistance=Infinity;key('forward',true);
 try{while(Math.hypot(player.pos.x-p[0],player.pos.z-p[2])>tolerance){await doors({x:p[0],z:p[2]});const distance=Math.hypot(player.pos.x-p[0],player.pos.z-p[2]);if(distance<.32){key('forward',false);await step(6,true);if(Math.hypot(player.pos.x-p[0],player.pos.z-p[2])<=tolerance)break;}await heading();key('forward',true);const frames=distance<.9?2:6;await step(frames,steps%4===0);steps+=frames;stall+=frames/60;minDistance=Math.min(minDistance,Math.hypot(player.pos.x-p[0],player.pos.z-p[2]));if(player.pos.distanceTo(previous)>.12){previous.copy(player.pos);stall=0;}if(stall>2.5)throw Error('physical walk obstruction');if(steps>1800)throw Error('walk waypoint deadline');}}
 finally{key('forward',false);trace.push({e:'walk-end',from:before.toArray(),to:player.pos.toArray(),target:p,minDistance,sim});}walked+=player.pos.distanceTo(before);
}
async function doors(next){
 const game=live(),p=game.player.pos,dx=next.x-p.x,dz=next.z-p.z,len=Math.hypot(dx,dz),near=game.world.facility?.doors.filter(d=>{if(d.kind!=='door'||d.open||d.locked||d.pos.distanceTo(game.player.eyePos())>=2.6||len<.01)return false;const x=d.pos.x-p.x,z=d.pos.z-p.z,along=(x*dx+z*dz)/len,lateral=Math.abs(x*dz-z*dx)/len;return along>-.3&&along<3&&lateral<1.4;})||[];
 for(const d of near){const moving=game.input.isDown('forward');key('forward',false);await use(d.pos.toArray(),t=>/open|door/i.test(t.label));await wait(()=>d.open,3000);if(moving)key('forward',true);}
}
async function path(points){for(const p of points){await doors(p);await walk([p.x,p.y,p.z],.3);}}
async function outdoor(p){const game=live();let report;const route=frame.contentWindow.qa41.certifiedWalk39(game.physics,game.player.pos,{x:p[0],y:p[1],z:p[2]},{...(game.player.indoor?{cell:.25,margin:6,maxStep:.1}:{}),report:r=>report=r});trace.push({e:'geometry-plan',target:p,report,path:route});if(!route)throw Error('no certified geometry route');for(const v of route)await walk(v,game.player.indoor?.08:.12);}
function physicalObservation(){const game=g(),p=game?.player;if(!p?.pos||!initial)return null;const dir={x:-Math.sin(p.yaw),y:0,z:-Math.cos(p.yaw)},describe=h=>h&&{distance:h.distance,point:h.point,kind:h.info?.kind,id:h.info?.id,door:h.info?.door&&{id:h.info.door.id,kind:h.info.door.kind,open:h.info.door.open,locked:h.info.door.locked,pos:h.info.door.pos.toArray()}};return{yaw:p.yaw,pitch:p.pitch,front:[.4,1.25].map(y=>describe(game.physics.raycast({x:p.pos.x,y:p.pos.y+y,z:p.pos.z},dir,5,65,p.col))),nearDoors:game.world.facility?.doors.filter(d=>d.pos.distanceTo(p.pos)<5).map(d=>({id:d.id,kind:d.kind,open:d.open,locked:d.locked,pos:d.pos.toArray()})),lift:game.world.facility?.group.getObjectByName('descent21-lobby')?.position.toArray()};}
function read(){const game=g();return{busy,failure,initial,sim,walked,phase:game?.run?.phase,mode:game?.config.mode,map:game?.world.moonId,seed:game?.run?.seed,theme:game?.world.facility?.layout.theme,queue:!!(game?.landQ?.pending||game?.landQ?.running),uiState:game&&{fullscreen:game.ui.fullscreenOpen(),cine:game.ui.cineActive,landing:game.landing10?.debug?.(),panel:game.ui.panelOpen?.className,minigame:!!game.minigame,downed:game.downed.isDowned(game.selfId)},endless:game?.endless41?.status(),offer:game?.endless41?.offer(),recording:game?.adventure40?.scene?.(),credits:game?.run?.credits,ship:game?.run?.sy,docked:game?.run?.fleet13?.docked,actors:game&&[...game.creatures.host.values()].map(c=>({id:c.id,type:c.type,pos:c.pos.toArray(),hp:c.hp,owned:game.endless41.owns(c)})),items:game&&[...game.items.all()].map(it=>({id:it.id,type:it.type,holder:it.holder,value:it.value,pos:it.obj.position.toArray()})),player:game&&{pos:game.player.pos.toArray(),hp:game.player.hp,dead:game.player.dead,indoor:game.player.indoor,input:game.input.enabled,slots:game.player.slots},master:game?.audio.settings.masterVolume,errors:game?.perfInfo?.().errors,pageErrors:frame.contentWindow.qa41errors,consoleErrors:frame.contentWindow.qa41consoleErrors,trace};}
const write=()=>out.textContent=JSON.stringify(stoppedState||read(),null,2);
function action(fn){return async()=>{if(busy||failure)return;busy=true;try{checkErrors();await fn();if(clock)await step(1,true);checkErrors();trace.push({e:'complete',sim});}catch(e){failure=e.message;trace.push({e:'STOP',message:e.message,sim});release();busy=false;stoppedState=structuredClone(read());clock?.restore();for(const b of document.querySelectorAll('button'))if(!['read','restore'].includes(b.id))b.disabled=true;}finally{release();busy=false;write();}};}
document.querySelector('#setup').onclick=action(async()=>{const game=g();if(initial||!game?.net.connected)throw Error('fresh ready page required');start=performance.now();game.ui.closePanel(true);game.terminal.close();game.input.unlock();freeze();initial={label:'native full boot, no injected outcomes',mode,phase:game.run.phase,docked:game.run.fleet13?.docked,ship:structuredClone(game.run.sy),starter:game.player.slots.map(id=>game.items.get(id)?.type),pos:game.player.pos.toArray()};await step(4,true);});
document.querySelector('#prepare').onclick=action(async()=>{const game=live();await walk([-3.2,0,0]);await walk([-5.25,0,.9],.1);await use(game.ship.points.terminal.toArray(),t=>/ENDLESS|SONSUZ/.test(t.label));});
document.querySelector('#land').onclick=action(async()=>{const game=live();game.ui.closePanel(true);game.input.unlock();await step(2,true);await walk([-3.2,0,0]);await walk([-5.25,0,.9],.1);await use(game.ship.points.lever.toArray());await wait(()=>game.run.phase==='moon'&&game.world.facility&&!game.landQ?.pending&&!game.landQ?.running);});
document.querySelector('#outside').onclick=action(async()=>{const game=live();game.ui.closePanel(true);game.input.unlock();await step(2,true);await walk([-3.2,0,0]);await walk([0,0,0]);await walk([2.6,0,1.2]);if(!game.ship.door.open)await use(game.ship.points.doorOpen.toArray());await walk([2.6,0,5.5]);await walk([2.6,0,8],.1);await outdoor([2.6,game.world.terrain.heightAt(2.6,12),12]);});
document.querySelector('#defend').onclick=action(async()=>{const game=live();game.ui.closePanel(true);game.input.unlock();const before={kills:game.run.endless41.kills,level:game.endless41.build()?.level};while(sim<300&&!game.endless41.offer()){await step(180,true);}trace.push({e:'native-defense-observation',before,after:{kills:game.run.endless41.kills,level:game.endless41.build()?.level,offer:game.endless41.offer()}});});

</script></body></html>
