<!doctype html><meta charset="utf-8"><title>Wave38 native guided QA</title>
<style>body{margin:0;background:#181a19;color:#ddd;font:12px monospace}header{padding:6px}button{margin:4px}pre{max-height:100px;overflow:auto}iframe{width:100%;height:calc(100vh - 160px);border:0}</style>
<header>DEV guided native integration. Initial loadout/body poses are setup, not earned exploration. One native App clock; silent isolated storage; no microphone.
<div><button id="setup">Initial dock cockpit setup</button><button id="board">Use cockpit E to board</button><button id="land">Initial cockpit pose then native E landing</button><button id="reactor">Initial reactor inspection pose</button><button id="exchange">Use reactor E</button><button id="core">Initial held core then native E install</button><button id="read">Read current state</button></div><pre id="out">Booting</pre></header><iframe id="frame"></iframe>
<script type="module">
if(!import.meta.env.DEV)throw Error('DEV only');
const frame=document.querySelector('#frame'),out=document.querySelector('#out');frame.src='/test/wave38_game.html?autohost=local&code=W38'+crypto.randomUUID().slice(0,6);
const game=()=>frame.contentWindow.kefal?.game;let busy=false,trace=[];
const wait=async fn=>{const end=performance.now()+30000;while(!fn()){if(performance.now()>end)throw Error('native observation deadline');await new Promise(requestAnimationFrame);}};
function read(){const g=game();return{trace,phase:g?.run.phase,docked:g?.fleet13.docked(),map:g?.world.moonId,facility:g?.world.facility?.layout.theme,power:g?.run.powerOn,dim:g?.lights.globalDim,reactor:g?.run.reactor38,radio:g?.run.radio38,player:g?.player.pos.toArray(),inShip:g?.player.inShip,master:g?.audio.settings.masterVolume,hidden:frame.contentDocument.hidden,prompt:frame.contentDocument.querySelector('.p-main')?.textContent,errors:g?.perfInfo?.().errors};}
const write=()=>out.textContent=JSON.stringify(read());
async function aim(target){const g=game(),p=g.player;for(let i=0;i<50;i++){const e=g.camera.position,d=target.clone().sub(e),yaw=Math.atan2(-d.x,-d.z),pitch=Math.atan2(d.y,Math.hypot(d.x,d.z)),a=Math.atan2(Math.sin(yaw-p.yaw),Math.cos(yaw-p.yaw)),b=pitch-p.pitch;if(Math.abs(a)<.015&&Math.abs(b)<.015)return;const gain=(g.settings.sensitivity||1)*.0022*(p.carryTurn||1);g.input.mouseDX+=Math.max(-350,Math.min(350,-a/gain));g.input.mouseDY+=Math.max(-350,Math.min(350,-b/gain/(g.settings.invertY?-1:1)));await new Promise(requestAnimationFrame);}throw Error('native mouse did not converge');}
async function pose(x,y,z,target){const g=game();g.ui.closePanel(true);g.terminal.close();g.input.unlock();g.player.teleport(new frame.contentWindow.THREE.Vector3(x,y,z),0);await wait(()=>g.player.inShip);await new Promise(requestAnimationFrame);await aim(target);await new Promise(requestAnimationFrame);}
async function use(){const w=frame.contentWindow,g=game(),code=g.input.key('interact');w.dispatchEvent(new w.KeyboardEvent('keydown',{code,key:code,bubbles:true}));await new Promise(requestAnimationFrame);w.dispatchEvent(new w.KeyboardEvent('keyup',{code,key:code,bubbles:true}));}
const run=fn=>async()=>{if(busy)return;busy=true;try{if(frame.contentDocument.hidden)throw Error('requires native visible App clock');await fn();}catch(e){trace.push({error:e.message});}finally{busy=false;write();}};
document.querySelector('#setup').onclick=run(async()=>{const g=game();if(!g?.net.connected||!g.fleet13.docked())throw Error('fresh dock required');const V=frame.contentWindow.THREE.Vector3;g.player.teleport(new V(0,.70,31.56),0);g.fleet13.request('buy','courier');await pose(-5.25,.05,.9,g.ship.points.lever);trace.push({setup:'owned courier and certified cockpit initial pose'});});
document.querySelector('#board').onclick=run(async()=>{const g=game();trace.push({before:g.findInteraction()?.label});await use();await wait(()=>!g.fleet13.docked());trace.push({result:'actual E dock dispatch'});});
document.querySelector('#land').onclick=run(async()=>{const g=game();await pose(-5.25,.05,.9,g.ship.points.lever);trace.push({before:g.findInteraction()?.label});await use();await wait(()=>g.run.phase==='moon'&&!g.landQ?.pending&&!g.landQ?.running);trace.push({result:'actual E normal landing'});});
document.querySelector('#reactor').onclick=run(async()=>{const V=frame.contentWindow.THREE.Vector3;await pose(5.1,.05,-1.8,new V(5.74,1.3,-2.8));trace.push({setup:'certified engine room initial inspection pose',interaction:game().findInteraction()?.label});});
document.querySelector('#exchange').onclick=run(async()=>{trace.push({before:game().findInteraction()?.label});await use();trace.push({result:'actual E reactor exchange'});});
document.querySelector('#core').onclick=run(async()=>{const g=game();const id=g.items.hostSpawn('reactor',g.player.pos,{holder:g.selfId,value:250,baseValue:250});g.player.slot=g.player.slots.indexOf(id);trace.push({setup:'native fresh core loadout; not earned salvage'});await new Promise(requestAnimationFrame);await use();trace.push({result:'actual E held core install'});});
document.querySelector('#read').onclick=write;
</script>
