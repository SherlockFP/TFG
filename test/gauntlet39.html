<!doctype html><html><head><meta charset="utf-8"><title>Wave39 earned return Gauntlet</title>
<style>body{margin:0;background:#171918;color:#ddd;font:12px monospace}header{padding:6px}button{margin:3px}pre{max-height:115px;overflow:auto;white-space:pre-wrap}iframe{width:100%;height:calc(100vh - 190px);border:0}</style></head><body>
<header>DEV ENTRANCE_TO_EARNED_HQ_SALE. Fresh isolated campaign/profile, silent audio. Initial entrance pose is setup. Controlled native App.tick clock, source-assisted Input aim deltas and bound key/E events; no outcome injection or human/FPS claim.
<div><button id="all">Run earned loop</button><button id="setup">Set up native seed1235 landing and entrance</button><button id="loot">Earn native salvage pickup</button><button id="return">Walk doorway and return to ship</button><button id="depart">Unload / start / cancel / restart departure</button><button id="hq">Walk terminal / route HQ / land</button><button id="refuel">Walk to reactor and buy emergency fuel</button><button id="sell">Walk to counter and sell earned cargo</button><button id="read">Read state</button><button id="restore">Release input and restore clock</button></div><pre id="out">Booting</pre></header><iframe id="frame"></iframe>
<script type="module">
if(!import.meta.env.DEV)throw Error('DEV only');
const frame=document.querySelector('#frame'),out=document.querySelector('#out');frame.src='/test/gauntlet39_game.html?autohost=local&code=G39'+crypto.randomUUID().slice(0,6);
let clock=null,busy=false,initial=null,trace=[],cargo=null,earned=null,start=0,sim=0,walked=0,failure=null,stoppedState=null,loopStage=null,loopComplete=false;
const g=()=>frame.contentWindow.kefal?.game,V=(x,y,z)=>new frame.contentWindow.THREE.Vector3(x,y,z),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function key(action,down){const w=frame.contentWindow,code=g().input.key(action);w.dispatchEvent(new w.KeyboardEvent(down?'keydown':'keyup',{code,key:code,bubbles:true,cancelable:true}));}
function release(){if(g())for(const k of ['forward','back','left','right','interact','drop','sprint'])key(k,false);}
function freeze(){const app=frame.contentWindow.kefal,game=g(),input=game.input;const bind=(o,k,f)=>{const own=Object.hasOwn(o,k),old=o[k];o[k]=f(old);return()=>{if(own)o[k]=old;else delete o[k];};};let permit=false;const undo=[bind(app,'loop',()=>function(t){this.last=t;frame.contentWindow.requestAnimationFrame(v=>this.loop(v));}),bind(game,'update',old=>function(dt){if(permit)return old.call(this,dt);}),bind(input,'endFrame',old=>function(){if(permit)return old.call(this);})];undo.push(bind(game.net,'request',old=>function(a,d={}){if(a==='lever')trace.push({e:'lever-request',request:structuredClone(d),current:frame.contentWindow.qa39.leverReceipt39(game),reach:frame.contentWindow.qa39.leverReach39(game,game.selfId),pos:game.player.pos.toArray(),sim});return old.call(this,a,d);}));undo.push(game.net.on('msg:sys',d=>trace.push({e:'native-sys',data:structuredClone(d),sim})));clock={step(n=1,render=false){permit=true;try{app.tick(n,1/60,render);sim+=n/60;}finally{permit=false;}},restore(){release();undo.reverse().forEach(f=>f());clock=null;}};}
function checkErrors(){if(g()?.perfInfo?.().errors?.total||frame.contentWindow.qa39errors?.length||frame.contentWindow.qa39consoleErrors?.length)throw Error('observed runtime error');}
function live(){const game=g();if(failure)throw Error('failed case requires a fresh page');checkErrors();if(!game||game.player.dead||game.downed.isDowned(game.selfId))throw Error('dead/downed operator');if(!clock)throw Error('clock not owned');if(sim>480)throw Error('eight-minute simulation budget');if(performance.now()-start>480000)throw Error('eight-minute wall budget');return game;}
async function step(n=1,render=false){live();clock.step(n,render);await new Promise(requestAnimationFrame);live();}
async function wait(fn,ms=24000){const end=performance.now()+ms;while(!fn()){if(performance.now()>end)throw Error('native observation deadline');await step(1,true);}}
async function tap(action){key(action,true);try{await step(2,true);}finally{key(action,false);}await step(2,true);}
async function aim(p){const game=live(),player=game.player;for(let i=0;i<50;i++){const d=V(...p).sub(game.camera.position),yaw=Math.atan2(-d.x,-d.z),pitch=Math.atan2(d.y,Math.hypot(d.x,d.z)),a=Math.atan2(Math.sin(yaw-player.yaw),Math.cos(yaw-player.yaw)),b=pitch-player.pitch;if(Math.abs(a)<.012&&Math.abs(b)<.012)return;const gain=(game.settings.sensitivity||1)*.0022*(player.carryTurn||1);game.input.mouseDX+=Math.max(-350,Math.min(350,-a/gain));game.input.mouseDY+=Math.max(-350,Math.min(350,-b/gain/(game.settings.invertY?-1:1)));await step(2,true);}throw Error('native aim did not converge');}
async function use(p,check){await aim(p);const t=g().findInteraction();trace.push({e:'before-E',label:t?.label,pos:g().player.pos.toArray(),sim});if(!t||check&&!check(t))throw Error('expected native E selection missing');await tap('interact');}
async function walk(p,tolerance=.32){
 const game=live(),player=game.player,before=player.pos.clone();if(game.ui.panelOpen||game.terminal.active||!game.input.enabled)throw Error('blocked native input');
 if(Math.hypot(player.pos.x-p[0],player.pos.z-p[2])<=tolerance)return;
 const heading=async()=>{const requested=Math.atan2(-(p[0]-player.pos.x),-(p[2]-player.pos.z)),turn=Math.atan2(Math.sin(requested-player.yaw),Math.cos(requested-player.yaw));if(Math.abs(turn)>.015||Math.abs(player.pitch)>.015){key('forward',false);await step(10,true);}const yaw=Math.atan2(-(p[0]-player.pos.x),-(p[2]-player.pos.z));for(let i=0;i<50;i++){const a=Math.atan2(Math.sin(yaw-player.yaw),Math.cos(yaw-player.yaw));if(Math.abs(a)<.015&&Math.abs(player.pitch)<.015)return;const gain=(game.settings.sensitivity||1)*.0022*(player.carryTurn||1);game.input.mouseDX+=Math.max(-350,Math.min(350,-a/gain));game.input.mouseDY+=Math.max(-350,Math.min(350,player.pitch/gain/(game.settings.invertY?-1:1)));await step(2,true);}throw Error('native walking heading did not converge');};
 trace.push({e:'walk-start',from:before.toArray(),target:p,yaw:player.yaw,sim});await heading();let previous=player.pos.clone(),stall=0,steps=0,minDistance=Infinity;key('forward',true);
 try{while(Math.hypot(player.pos.x-p[0],player.pos.z-p[2])>tolerance){await doors({x:p[0],z:p[2]});const distance=Math.hypot(player.pos.x-p[0],player.pos.z-p[2]);if(distance<.32){key('forward',false);await step(6,true);if(Math.hypot(player.pos.x-p[0],player.pos.z-p[2])<=tolerance)break;}await heading();key('forward',true);const frames=distance<.9?2:6;await step(frames,steps%4===0);steps+=frames;stall+=frames/60;minDistance=Math.min(minDistance,Math.hypot(player.pos.x-p[0],player.pos.z-p[2]));if(player.pos.distanceTo(previous)>.12){previous.copy(player.pos);stall=0;}if(stall>2.5)throw Error('physical walk obstruction');if(steps>1800)throw Error('walk waypoint deadline');}}
 finally{key('forward',false);trace.push({e:'walk-end',from:before.toArray(),to:player.pos.toArray(),target:p,minDistance,sim});}walked+=player.pos.distanceTo(before);
}
async function doors(next){
 const game=live(),p=game.player.pos,dx=next.x-p.x,dz=next.z-p.z,len=Math.hypot(dx,dz),near=game.world.facility?.doors.filter(d=>{if(d.kind!=='door'||d.open||d.locked||d.pos.distanceTo(game.player.eyePos())>=2.6||len<.01)return false;const x=d.pos.x-p.x,z=d.pos.z-p.z,along=(x*dx+z*dz)/len,lateral=Math.abs(x*dz-z*dx)/len;return along>-.3&&along<3&&lateral<1.4;})||[];
 for(const d of near){const moving=game.input.isDown('forward');key('forward',false);await use(d.pos.toArray(),t=>/open|door/i.test(t.label));await wait(()=>d.open,3000);if(moving)key('forward',true);}
}
async function path(points){for(const p of points){await doors(p);await walk([p.x,p.y,p.z],.3);}}
async function outdoor(p){const game=live();let report;const route=frame.contentWindow.qa39.certifiedWalk39(game.physics,game.player.pos,{x:p[0],y:p[1],z:p[2]},{...(game.player.indoor?{cell:.25,margin:6,maxStep:.1}:{}),report:r=>report=r});trace.push({e:'geometry-plan',target:p,report,path:route});if(!route)throw Error('no certified geometry route');for(const v of route)await walk(v,game.player.indoor?.08:.12);}
function physicalObservation(){const game=g(),p=game?.player;if(!p?.pos||!initial)return null;const dir={x:-Math.sin(p.yaw),y:0,z:-Math.cos(p.yaw)},describe=h=>h&&{distance:h.distance,point:h.point,kind:h.info?.kind,id:h.info?.id,door:h.info?.door&&{id:h.info.door.id,kind:h.info.door.kind,open:h.info.door.open,locked:h.info.door.locked,pos:h.info.door.pos.toArray()}};return{yaw:p.yaw,pitch:p.pitch,front:[.4,1.25].map(y=>describe(game.physics.raycast({x:p.pos.x,y:p.pos.y+y,z:p.pos.z},dir,5,65,p.col))),nearDoors:game.world.facility?.doors.filter(d=>d.pos.distanceTo(p.pos)<5).map(d=>({id:d.id,kind:d.kind,open:d.open,locked:d.locked,pos:d.pos.toArray()})),lift:game.world.facility?.group.getObjectByName('descent21-lobby')?.position.toArray()};}
function read(){const game=g();return{busy,failure,loopStage,loopComplete,observation:physicalObservation(),initial,sim,wall:start?(performance.now()-start)/1000:0,walked,phase:game?.run.phase,map:game?.world.moonId,seed:game?.run.seed,theme:game?.world.facility?.layout.theme,power:game?.run.powerOn,dim:game?.lights.globalDim,cargo,earned,item:cargo&&game?.items.get(cargo)&&{id:cargo,holder:game.items.get(cargo).holder,state:game.items.get(cargo).state,value:game.items.get(cargo).value,pos:game.items.get(cargo).obj.position.toArray()},player:game&&{pos:game.player.pos.toArray(),hp:game.player.hp,dead:game.player.dead,indoor:game.player.indoor,inShip:game.player.inShip,input:game.input.enabled,slots:game.player.slots},credits:game?.run.credits,sold:game?.run.sold,departure:game?.run.departure38,faults:game?.gameplay2?.faults?.snapshot(),reactor:game?.run.reactor38,master:game?.audio.settings.masterVolume,queue:!!(game?.landQ?.pending||game?.landQ?.running),prompt:frame.contentDocument?.querySelector('.p-main')?.textContent,errors:game?.perfInfo?.().errors,pageErrors:frame.contentWindow.qa39errors,consoleErrors:frame.contentWindow.qa39consoleErrors,trace};}
const write=()=>out.textContent=JSON.stringify(stoppedState||read(),null,2);
function action(fn){return async()=>{if(busy||failure)return;busy=true;try{checkErrors();await fn();if(clock)await step(1,true);checkErrors();trace.push({e:'complete',sim});}catch(e){failure=e.message;trace.push({e:'STOP',message:e.message,sim});release();busy=false;stoppedState=structuredClone(read());clock?.restore();for(const b of document.querySelectorAll('button'))if(!['read','restore'].includes(b.id))b.disabled=true;}finally{release();busy=false;write();}};}
document.querySelector('#setup').onclick=action(async()=>{const game=g();if(initial||!game?.net.connected)throw Error('fresh ready page required');start=performance.now();freeze();game.ui.closePanel(true);game.terminal.close();game.input.unlock();game.player.teleport(V(0,.70,31.56),0);game.fleet13.request('buy','courier');game.player.teleport(V(3,.2,9.48),0);game.fleet13.request('board');await step(4,true);game.player.teleport(V(-5.25,.05,.9),0);await step(4,true);const old=game.meta.weekly.hostOnLever;game.meta.weekly.hostOnLever=r=>{r.seed=1235;};try{await use(game.ship.points.lever.toArray(),t=>/Land on/.test(t.label));await wait(()=>game.run.phase==='landing',3000);}finally{game.meta.weekly.hostOnLever=old;}await wait(()=>game.run.phase==='moon'&&game.world.facility&&!game.landQ?.pending&&!game.landQ?.running,18000);game.player.teleport(game.world.facility.mainDoor.spawn.clone(),game.world.facility.mainDoor.faceYaw);game.player.pitch=0;await step(4,true);sim=0;initial={campaign:'fresh isolated native host',seed:game.run.seed,pose:'initial facility.mainDoor.spawn',population:'actual hostLever / hostFinishLanding',source:'setup only',layout:game.world.facility.layout.theme};await tap('flashlight');});
document.querySelector('#loot').onclick=action(async()=>{const game=live(),fac=game.world.facility,reach=frame.contentWindow.qa39.physicalReach21(fac,game.physics),candidates=[];for(const it of game.items.all()){if(it.state!=='world'||it.holder||it.soulbound||it.def.kind!=='scrap'||!(it.value>0)||it.type==='reactor'||it.def.special||!fac.contains(it.obj.position))continue;for(const [dx,dz]of[[1.5,0],[-1.5,0],[0,1.5],[0,-1.5]]){const p=it.obj.position,approach={x:p.x+dx,y:fac.layout.y,z:p.z+dz};if(!reach(approach.x,approach.z))continue;const route=reach.pathTo(approach.x,approach.z),eye=V(approach.x,approach.y+1.62,approach.z);if(route&&game.physics.lineOfSight(eye,p,65)){candidates.push({it,route,approach,length:route.reduce((n,p,i)=>n+(i?Math.hypot(p.x-route[i-1].x,p.z-route[i-1].z):0),0)});break;}}}candidates.sort((a,b)=>a.length-b.length);const chosen=candidates[0];if(!chosen)throw Error('no certified ordinary sale target');await tap('hotbar4');await path(chosen.route);await use(chosen.it.obj.position.toArray(),t=>t.pickupItem?.id===chosen.it.id);await wait(()=>chosen.it.holder===game.selfId&&!chosen.it.predicted);cargo=chosen.it.id;earned={id:cargo,type:chosen.it.type,value:chosen.it.value,path:chosen.route,approach:chosen.approach};});
document.querySelector('#return').onclick=action(async()=>{const game=live(),fac=game.world.facility;if(!cargo||game.items.get(cargo)?.holder!==game.selfId)throw Error('earned native cargo required');const returnReach=frame.contentWindow.qa39.physicalReach21(fac,game.physics),currentReturn=returnReach.pathTo(game.player.pos.x,game.player.pos.z);if(!currentReturn)throw Error('no certified current return path');trace.push({e:'current-return-plan',path:currentReturn});for(const p of [...currentReturn].reverse()){await doors(p);await outdoor([p.x,p.y,p.z]);}await outdoor(fac.mainDoor.spawn.toArray());await use(fac.mainDoor.pos.toArray(),t=>/Exit facility/i.test(t.label));await wait(()=>!game.player.indoor);const points=[...game.world.terrain.pathPts].reverse().filter(p=>Math.hypot(p.x,p.z)>=12);for(const p of points)await walk([p.x,p.y||0,p.z],.7);await outdoor([2.6,-1.25,6.6]);await outdoor([2.6,0,2.9]);await wait(()=>game.player.inShip);if(game.items.get(cargo)?.holder!==game.selfId)throw Error('cargo custody lost on return');});
document.querySelector('#depart').onclick=action(async()=>{const game=live();if(!game.player.inShip||!cargo)throw Error('earned aboard cargo required');await tap('drop');await wait(()=>game.items.get(cargo)?.state==='world');await walk([0,0,0]);await walk([-3.2,0,0]);await walk([-5.25,0,.9],.08);await use(game.ship.points.lever.toArray(),t=>/take off/i.test(t.label));await wait(()=>!!game.run.departure38,3000);await use(game.ship.points.lever.toArray(),t=>/Cancel/i.test(t.label));await wait(()=>!game.run.departure38,3000);const canceledUntil=performance.now()+8500;while(performance.now()<canceledUntil)await step(1,true);if(game.run.phase!=='moon')throw Error('canceled timer departed');await use(game.ship.points.lever.toArray(),t=>/take off/i.test(t.label));await wait(()=>game.run.phase==='orbit',20000);if(!game.items.get(cargo))throw Error('earned cargo lost through takeoff');});
async function command(text){const term=g().terminal;term.inp.value=text;term.inp.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown',{key:'Enter',code:'Enter',bubbles:true,cancelable:true}));await step(3,true);}
document.querySelector('#hq').onclick=action(async()=>{const game=live();await walk([-5.35,0,2.45]);await use(game.ship.points.terminal.toArray(),t=>/terminal/i.test(t.label));await wait(()=>game.terminal.active);await command('ROUTE HQ');await command('CONFIRM');await wait(()=>game.run.moon==='hq',3000);game.terminal.inp.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown',{key:'Escape',code:'Escape',bubbles:true}));await step(2,true);game.input.unlock();await walk([-5.25,0,.9],.08);await use(game.ship.points.lever.toArray(),t=>/Land on/.test(t.label));await wait(()=>game.run.phase==='company'&&game.world.company&&!game.landQ?.pending&&!game.landQ?.running,18000);});
document.querySelector('#refuel').onclick=action(async()=>{const game=live();if(game.run.phase!=='company')throw Error('native HQ required');await walk([-3.2,0,0]);await walk([0,0,0]);await walk([2.6,0,-2.3]);await walk([5.3,0,-2.3]);const socket=game.reactor38.socket();await use(socket.toArray(),t=>/Remove spent/.test(t.label));await wait(()=>!game.run.reactor38.installed,3000);const before={credits:game.run.credits,debt:game.run.reactor38.serviceDebt||0};await use(socket.toArray(),t=>/Company emergency refuel/.test(t.label));await wait(()=>game.run.reactor38.ready,3000);trace.push({e:'native-emergency-fuel',before,after:{credits:game.run.credits,debt:game.run.reactor38.serviceDebt||0}});await walk([2.6,0,-2.3]);await walk([0,0,0]);await walk([-3.2,0,0]);await walk([-5.25,0,.9],.08);});
document.querySelector('#sell').onclick=action(async()=>{const game=live(),it=game.items.get(cargo),co=game.world.company;if(!co||!it)throw Error('earned Company cargo required');await walk([-3.2,0,0]);await walk([0,0,0]);await walk([2.6,0,2.9]);await use(it.obj.position.toArray(),t=>t.pickupItem?.id===cargo);await wait(()=>it.holder===game.selfId);if(!game.ship.door.open)await use(game.ship.points.doorOpen.toArray(),t=>/open/i.test(t.label));const zone=co.interactables.find(i=>i.type==='sellzone'),bell=co.interactables.find(i=>i.type==='bell');await outdoor([zone.pos.x,co.groundY,zone.pos.z+1.1]);await aim([zone.pos.x,zone.pos.y+.25,zone.pos.z]);await tap('drop');await step(12,true);trace.push({e:'counter-drop',item:it.obj.position.toArray(),zone:zone.pos.toArray(),size:zone.size.toArray(),sim});const half=zone.size.clone().multiplyScalar(.5),placed=it.obj.position;if(Math.abs(placed.x-zone.pos.x)>=half.x+.3||Math.abs(placed.z-zone.pos.z)>=half.z+.6||placed.y<=zone.pos.y-1||placed.y>=zone.pos.y+2.5)throw Error('native drop missed intake');const before={credits:game.run.credits,sold:game.run.sold};await use(bell.pos.toArray(),t=>/bell/i.test(t.label));await wait(()=>!game.items.get(cargo)&&game.run.sold>before.sold,6000);trace.push({e:'earned-sale',id:cargo,before,after:{credits:game.run.credits,sold:game.run.sold}});});
document.querySelector('#all').onclick=async()=>{if(busy||failure||initial)return;document.querySelector('#all').disabled=true;for(const id of ['setup','loot','return','depart','hq','refuel','sell']){loopStage=id;await document.getElementById(id).onclick();if(failure)break;}loopComplete=!failure;write();};document.querySelector('#read').onclick=write;document.querySelector('#restore').onclick=()=>{clock?.restore();write();};window.addEventListener('pagehide',()=>clock?.restore());
</script></body></html>
